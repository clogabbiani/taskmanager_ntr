name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (unit + RLS on PGlite)
        run: pnpm test

      - name: Drizzle check
        run: pnpm db:check

      - name: Schema and migrations in sync
        run: |
          pnpm drizzle-kit generate
          git diff --exit-code -- drizzle || (echo "::error::src/db/schema.ts has changes without a migration. Run pnpm db:generate." && exit 1)
          test -z "$(git status --porcelain -- drizzle)" || (echo "::error::Untracked migration generated. Run pnpm db:generate." && exit 1)

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
